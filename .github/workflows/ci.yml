name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Тесты одной командой (A-13)
        run: npm test
      - name: Линтер без предупреждений (AN-01/AN-07/AN-09)
        run: npm run lint
      - name: Форматтер (AN-02)
        run: npm run format:check
      - name: Покрытие тестами (AN-06/AB-16)
        run: npm run coverage
      - name: Публикуем отчёт покрытия артефактом (AB-16)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  license-check:
    name: License check (Z-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Проверяем отсутствие копилефт-зависимостей (Z-08)
        run: node scripts/license-check.mjs

  desktop:
    name: Desktop app (${{ matrix.os }}) — X-16
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack desktop app (unpacked)
        run: npx electron-builder --dir
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1mesto-flow-${{ matrix.os }}
          path: release/*-unpacked/
          retention-days: 7
